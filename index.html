<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TRAFFIC – NHẬN DIỆN VÀ ĐẾM PHƯƠNG TIỆN GIAO THÔNG</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tích hợp ONNX Runtime Web từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <header class="app-header">
            <h1>AI TRAFFIC – NHẬN DIỆN VÀ ĐẾM PHƯƠNG TIỆN GIAO THÔNG</h1>
            <div class="header-meta">
                <div class="meta-item">🕒 <span id="clock">00:00:00</span></div>
                <div class="meta-item">⚡ FPS: <span id="fps-display">0</span></div>
                <div class="meta-item">Trạng thái: <span id="system-status" class="status-badge waiting">AI READY</span></div>
            </div>
        </header>

        <!-- MAIN DASHBOARD GRID -->
        <div class="dashboard-grid">
            <!-- VIDEO CONTAINER & CONTROLS -->
            <div class="card video-card">
                <div class="card-title">📹 Video Giao Thông & Khung Nhận Diện AI</div>
                <div class="video-container">
                    <video id="video-source" muted playsinline style="display:none;"></video>
                    <canvas id="canvas" width="640" height="480"></canvas>
                </div>
                
                <div class="file-input-wrapper">
                    <label for="upload-video" class="btn btn-file">📁 Chọn Video</label>
                    <input type="file" id="upload-video" accept="video/*">
                    <span id="file-name" class="file-name">Chưa chọn file nào</span>
                </div>

                <div class="control-panel">
                    <button id="btn-start" class="btn btn-success" onclick="startAI()">START AI</button>
                    <button id="btn-stop" class="btn btn-danger" onclick="stopAI()">STOP</button>
                </div>
            </div>

            <!-- STATS PANEL -->
            <div class="card stats-card">
                <div class="card-title">📊 Thống Kê Số Lượng Phương Tiện</div>
                <div class="stat-item car">
                    <span class="label">🚗 Ô tô (Car)</span>
                    <span class="value" id="count-car">0</span>
                </div>
                <div class="stat-item moto">
                    <span class="label">🏍 Xe máy (Motorcycle)</span>
                    <span class="value" id="count-moto">0</span>
                </div>
                <div class="stat-item bus">
                    <span class="label">🚌 Xe buýt (Bus)</span>
                    <span class="value" id="count-bus">0</span>
                </div>
                <div class="stat-item truck">
                    <span class="label">🚚 Xe tải (Truck)</span>
                    <span class="value" id="count-truck">0</span>
                </div>
                <div class="stat-item total">
                    <span class="label">📈 Tổng Số Lượng (Total)</span>
                    <span class="value" id="count-total">0</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
